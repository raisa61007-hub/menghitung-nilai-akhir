<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Nilai Akhir</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div class="kalkulator">
    <h1>Kalkulator Nilai Akhir</h1>
    <p class="bobot">Tugas 30% &middot; UTS 30% &middot; UAS 40%</p>
 
    <label for="tugas">Nilai Tugas</label>
    <input type="number" id="tugas" min="0" max="100" placeholder="0 - 100">
 
    <label for="uts">Nilai UTS</label>
    <input type="number" id="uts" min="0" max="100" placeholder="0 - 100">
 
    <label for="uas">Nilai UAS</label>
    <input type="number" id="uas" min="0" max="100" placeholder="0 - 100">
 
    <button onclick="hitungNilai()">Hitung Nilai Akhir</button>
 
    <p id="hasil"></p>
  </div>
 
  <script src="script.js"></script>
</body>
</html>
